title: "KCM Trade Legal"
description: "Official legal, regulatory, and compliance documentation for KCM Trade."
url: "https://kcm-trade.github.io"
baseurl: "/kcmtrade-legal"

markdown: kramdown
kramdown:
  input: GFM

plugins:
  - jekyll-sitemap

# Force ALL pages/posts/markdown files to use the default layout unless overridden
defaults:
  - scope:
      path: ""
    values:
      layout: "default"

# Optional (choose one)
# If you want /privacy-policy/ style URLs:
permalink: pretty
